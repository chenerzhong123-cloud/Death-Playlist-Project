name: Deploy to Alibaba Cloud

on:
  push:
    branches: [main, master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          script_stop: true
          script: |
            cd /root/deathplaylist_backends
            git pull origin main || git pull origin master
            docker build -t deathplaylist .
            docker stop deathplaylist || true
            docker rm deathplaylist || true
            docker run -d --name deathplaylist -p 80:80 --restart=always deathplaylist
