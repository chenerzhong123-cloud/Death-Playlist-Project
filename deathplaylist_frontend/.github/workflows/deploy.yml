name: Deploy to Alibaba Cloud

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e

            # 拉取前端最新代码并构建
            cd /root/deathplaylist_frontend
            git pull origin main
            npm install --prefer-offline
            npm run build

            # 复制构建产物到后端 static 目录
            rm -rf /root/deathplaylist_backends/static
            cp -r dist /root/deathplaylist_backends/static

            # 拉取后端最新代码
            cd /root/deathplaylist_backends
            git pull origin main

            # 构建并部署 Docker
            docker build -t deathplaylist .
            docker stop deathplaylist || true
            docker rm deathplaylist || true
            docker run -d \
              --name deathplaylist \
              -p 80:80 \
              --restart=always \
              --env-file /root/deathplaylist_backends/.env \
              -v deathplaylist-data:/data \
              deathplaylist

            # 健康检查
            sleep 5
            curl -sf http://localhost/api/songs/search?q=test&limit=1 || exit 1
            echo "Deployment successful"
