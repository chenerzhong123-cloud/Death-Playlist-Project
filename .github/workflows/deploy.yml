name: Deploy to Alibaba Cloud

on:
  push:
    branches: [main]
    paths:
      - 'deathplaylist_frontend/**'
      - 'deathplaylist_backends/**'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e

            REPO=/root/deathplaylist
            if [ ! -d "$REPO/.git" ]; then
              rm -rf "$REPO"
              git clone git@github.com:chenerzhong123-cloud/Death-Playlist-Project.git "$REPO"
            fi

            cd "$REPO"
            git fetch origin main
            git reset --hard origin/main

            if [ ! -f deathplaylist_backends/.env ] && [ -f /root/deathplaylist_backends/.env ]; then
              cp /root/deathplaylist_backends/.env deathplaylist_backends/.env
            fi

            cd deathplaylist_frontend
            npm ci --prefer-offline
            npm run build

            cd "$REPO"
            rm -rf deathplaylist_backends/static
            cp -r deathplaylist_frontend/dist deathplaylist_backends/static

            cd deathplaylist_backends
            npm ci --prefer-offline
            npm run build
            docker build -t deathplaylist .
            # Rehearse startup against an in-memory database before touching the live container.
            docker run --rm --env-file "$REPO/deathplaylist_backends/.env" \
              -e DB_DATABASE=:memory: --entrypoint node deathplaylist -e '
              (async () => {
                for (const dependency of ["jest", "ts-jest", "@nestjs/cli"]) {
                  let installed = false;
                  try { require.resolve(dependency); installed = true; } catch {}
                  if (installed) throw new Error("Development dependency in runtime image: " + dependency);
                }
                const { NestFactory } = require("@nestjs/core");
                const { AppModule } = require("./dist/app.module");
                const { configureApp } = require("./dist/setup");
                const app = await NestFactory.create(AppModule, { logger: false });
                configureApp(app);
                await app.init();
                await app.close();
                console.log("Runtime image startup and production dependency check passed");
              })().catch(() => { console.error("Runtime image check failed"); process.exit(1); });'
            docker rm -f deathplaylist || true
            docker run -d \
              --name deathplaylist \
              -p 127.0.0.1:3000:3000 \
              --restart=always \
              --env-file "$REPO/deathplaylist_backends/.env" \
              -v deathplaylist-data:/data \
              deathplaylist

            sleep 5
            curl -sf http://127.0.0.1:3000/api/songs/search?q=test\&limit=1 || exit 1
            echo "Deployment successful"
