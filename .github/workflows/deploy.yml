name: Deploy to Alibaba Cloud

on:
  push:
    branches: [main]
    paths:
      - 'deathplaylist_frontend/**'
      - 'deathplaylist_backends/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e

            REPO=/root/deathplaylist
            if [ ! -d "$REPO/.git" ]; then
              rm -rf "$REPO"
              git clone git@github.com:chenerzhong123-cloud/Death-Playlist-Project.git "$REPO"
            fi

            cd "$REPO"
            git fetch origin main
            git reset --hard origin/main

            if [ ! -f deathplaylist_backends/.env ] && [ -f /root/deathplaylist_backends/.env ]; then
              cp /root/deathplaylist_backends/.env deathplaylist_backends/.env
            fi

            cd deathplaylist_frontend
            npm install --prefer-offline
            npm run build

            cd "$REPO"
            rm -rf deathplaylist_backends/static
            cp -r deathplaylist_frontend/dist deathplaylist_backends/static

            cd deathplaylist_backends
            npm install --prefer-offline
            npm run build
            docker build -t deathplaylist .
            docker rm -f deathplaylist || true
            docker run -d \
              --name deathplaylist \
              -p 127.0.0.1:3000:3000 \
              --restart=always \
              --env-file "$REPO/deathplaylist_backends/.env" \
              -v deathplaylist-data:/data \
              deathplaylist

            sleep 5
            curl -sf http://127.0.0.1:3000/api/songs/search?q=test\&limit=1 || exit 1
            echo "Deployment successful"
